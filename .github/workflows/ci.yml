name: ci

on:
  push:
    branches: [dev, sync/integration]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

  unit:
    name: unit (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: darwin
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run unit tests
        run: bun turbo test

  nix_build:
    name: nix-build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            cache_path: linux
          - name: darwin
            os: macos-latest
            cache_path: darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Configure repository cache
        env:
          CACHE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ matrix.cache_path }}
          CACHE_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/nix
          printf '%s\n' "extra-substituters = $CACHE_URL" >> ~/.config/nix/nix.conf
          if [ -n "$CACHE_KEY" ]; then
            printf '%s\n' "extra-trusted-public-keys = $CACHE_KEY" >> ~/.config/nix/nix.conf
          fi

      - name: Evaluate flake outputs
        run: |
          set -euo pipefail
          sys=$(nix eval --impure --expr builtins.currentSystem --raw)
          nix --version
          nix flake metadata
          nix flake show --all-systems
          nix eval ".#packages.${sys}.opencode.drvPath" --raw
          nix eval ".#devShells.${sys}.default.drvPath" --raw

      - name: Build Nix package
        run: |
          set -euo pipefail
          sys=$(nix eval --impure --expr builtins.currentSystem --raw)
          nix build ".#packages.${sys}.opencode" --print-out-paths | tee /tmp/static-nix-cache-paths.txt

      - name: Save Nix binary
        if: github.repository == 'adampoit/opencode' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: adampoit/static-nix-cache/save@master
        with:
          paths-file: /tmp/static-nix-cache-paths.txt
          name: ${{ matrix.name }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

  publish_nix_cache:
    name: publish nix cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'adampoit/opencode' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [typecheck, unit, nix_build]
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Generate Linux cache site
        uses: adampoit/static-nix-cache/deploy@master
        with:
          artifact-pattern: static-nix-cache-linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-release-tag: nix-cache-linux
          static: ./site/linux

      - name: Generate Darwin cache site
        uses: adampoit/static-nix-cache/deploy@master
        with:
          artifact-pattern: static-nix-cache-darwin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-release-tag: nix-cache-darwin
          static: ./site/darwin

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy GitHub Pages site
        id: pages
        uses: actions/deploy-pages@v4
