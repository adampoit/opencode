name: Promote Tested Sync Branch

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'sync/integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run patchlane promote
        env:
          GITHUB_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          npx patchlane promote \
            --base-branch=dev \
            --sync-branch=sync/integration \
            --expected-sync-sha="${{ github.event.workflow_run.head_sha }}"
