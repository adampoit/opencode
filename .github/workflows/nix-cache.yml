name: nix-cache

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: darwin
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Configure repository cache
        env:
          CACHE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          CACHE_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/nix
          printf '%s\n' "extra-substituters = $CACHE_URL" >> ~/.config/nix/nix.conf
          if [ -n "$CACHE_KEY" ]; then
            printf '%s\n' "extra-trusted-public-keys = $CACHE_KEY" >> ~/.config/nix/nix.conf
          fi

      - name: Snapshot Nix store
        uses: adampoit/static-nix-cache/setup@7e2610408dcb426a2708f057e585d108cf32e221

      - name: Build Nix output
        run: nix build .#opencode

      - name: Save store paths
        uses: adampoit/static-nix-cache/save@7e2610408dcb426a2708f057e585d108cf32e221
        with:
          name: ${{ matrix.name }}

  publish:
    name: publish nix cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Upload NARs and generate cache site
        uses: adampoit/static-nix-cache/deploy@7e2610408dcb426a2708f057e585d108cf32e221
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          static: ./site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy GitHub Pages site
        id: pages
        uses: actions/deploy-pages@v4
