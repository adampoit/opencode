name: fork-sync-upstream-release

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific upstream tag to sync (optional)"
        required: false
        type: string
      base_branch:
        description: "Target branch in this fork (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest upstream release into fork branch
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BASE: ${{ inputs.base_branch }}
          DEFAULT_BASE: ${{ vars.FORK_SYNC_BASE_BRANCH || github.event.repository.default_branch }}
          REVIEWER: ${{ vars.FORK_SYNC_REVIEWER }}
          UPSTREAM_REPO: ${{ vars.FORK_SYNC_UPSTREAM_REPO || 'anomalyco/opencode' }}
        run: |
          set -euo pipefail

          TOKEN="${SYNC_TOKEN:-$GH_TOKEN}"
          export GH_TOKEN="${TOKEN}"

          BASE="${INPUT_BASE:-$DEFAULT_BASE}"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch --force upstream "refs/tags/*:refs/tags/*"
          git fetch --force origin "refs/heads/${BASE}:refs/remotes/origin/${BASE}"

          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
          fi

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "::error::Unable to resolve upstream release tag"
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            git fetch --force upstream "refs/tags/${TAG}:refs/tags/${TAG}"
          fi

          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          SYNC_BRANCH="sync/upstream-${TAG//\//-}"

          if git merge-base --is-ancestor "${SHA}" "origin/${BASE}"; then
            echo "Upstream tag ${TAG} is already present in ${BASE}."
            exit 0
          fi

          git push --force-with-lease origin "${SHA}:refs/heads/${SYNC_BRANCH}"

          if ! gh label list -R "${REPO}" --json name --jq '.[].name' | grep -qx "upstream-sync"; then
            gh label create -R "${REPO}" "upstream-sync" --color "1d76db" --description "Automated upstream release sync"
          fi

          PR="$(gh pr list -R "${REPO}" --state open --base "${BASE}" --head "${SYNC_BRANCH}" --json number --jq '.[0].number // empty')"

          BODY="$(printf '%s\n' \
            '## Summary' \
            "- Sync upstream release \`${TAG}\` from \`${UPSTREAM_REPO}\` into \`${BASE}\`." \
            "- Branch \`${SYNC_BRANCH}\` points to upstream tag commit \`${SHA}\`." \
            '- This PR is generated by `.github/workflows/fork-sync-upstream-release.yml`.' \
            '' \
            '## Behavior' \
            '- Auto-merge is enabled when branch protection checks pass.' \
            '- If merge conflicts or required checks fail, watchdog workflow requests manual review.')"

          if [ -z "${PR}" ]; then
            gh pr create \
              -R "${REPO}" \
              --base "${BASE}" \
              --head "${SYNC_BRANCH}" \
              --title "chore(sync): merge upstream ${TAG} into ${BASE}" \
              --body "${BODY}"
            PR="$(gh pr list -R "${REPO}" --state open --base "${BASE}" --head "${SYNC_BRANCH}" --json number --jq '.[0].number // empty')"
          else
            gh pr edit -R "${REPO}" "${PR}" \
              --title "chore(sync): merge upstream ${TAG} into ${BASE}" \
              --body "${BODY}"
          fi

          if [ -z "${PR}" ]; then
            echo "::error::Failed to resolve sync PR number"
            exit 1
          fi

          gh pr edit -R "${REPO}" "${PR}" --add-label "upstream-sync"

          if gh pr merge -R "${REPO}" "${PR}" --auto --merge; then
            echo "Enabled auto-merge for PR #${PR}."
            exit 0
          fi

          MERGEABLE="$(gh pr view -R "${REPO}" "${PR}" --json mergeable --jq '.mergeable')"
          FLAGGED="$(gh api "repos/${REPO}/issues/${PR}/comments" --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("[sync-watchdog]")))] | length')"

          if [ "${FLAGGED}" -eq 0 ]; then
            MENTION=""
            if [ -n "${REVIEWER}" ]; then
              gh pr edit -R "${REPO}" "${PR}" --add-reviewer "${REVIEWER}" || true
              MENTION="@${REVIEWER} "
            fi

            gh pr comment -R "${REPO}" "${PR}" --body "[sync-watchdog] ${MENTION}Auto-merge could not be enabled (mergeable=${MERGEABLE}). Please review this sync PR."
          fi
