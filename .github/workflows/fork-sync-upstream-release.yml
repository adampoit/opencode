name: fork-sync-upstream-release

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific upstream tag to sync (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          persist-credentials: true

      - name: Sync latest upstream release into fork branch
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          REVIEWER: ${{ vars.FORK_SYNC_REVIEWER }}
          UPSTREAM_REPO: ${{ vars.FORK_SYNC_UPSTREAM_REPO || 'anomalyco/opencode' }}
        run: |
          set -euo pipefail

          TOKEN="${SYNC_TOKEN:-$GH_TOKEN}"
          export GH_TOKEN="${TOKEN}"

          BASE="dev"
          SYNC_BRANCH="sync/upstream-release"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch --force upstream "refs/tags/*:refs/tags/*"
          git fetch --force origin "refs/heads/${BASE}:refs/remotes/origin/${BASE}"

          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
          fi

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "::error::Unable to resolve upstream release tag"
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            git fetch --force upstream "refs/tags/${TAG}:refs/tags/${TAG}"
          fi

          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"

          if git merge-base --is-ancestor "${SHA}" "origin/${BASE}"; then
            echo "Upstream tag ${TAG} is already present in ${BASE}."
            exit 0
          fi

          git checkout -B "${SYNC_BRANCH}" "origin/${BASE}"

          if git merge --no-ff -m "chore(sync): merge upstream ${TAG} into ${BASE}" "${SHA}"; then
            SYNC_HEAD="$(git rev-parse HEAD)"
            SYNC_MODE="merge"
          else
            git merge --abort || true
            git checkout -B "${SYNC_BRANCH}" "${SHA}"
            SYNC_HEAD="${SHA}"
            SYNC_MODE="tag"
          fi

          PUSH_ERR=""
          if ! PUSH_ERR="$(git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}" 2>&1)"; then
            if grep -q "without \`workflows\` permission" <<<"${PUSH_ERR}"; then
              echo "::error::Push rejected for workflow file changes. Ensure FORK_SYNC_TOKEN has workflows:write and is used by checkout."
            fi

            printf '%s\n' "${PUSH_ERR}" >&2
            exit 1
          fi

          if ! gh label list -R "${REPO}" --json name --jq '.[].name' | grep -qx "upstream-sync"; then
            gh label create -R "${REPO}" "upstream-sync" --color "1d76db" --description "Automated upstream release sync"
          fi

          PR="$(gh pr list -R "${REPO}" --state open --base "${BASE}" --head "${SYNC_BRANCH}" --json number --jq '.[0].number // empty')"

          BODY="$(printf '%s\n' \
            '## Summary' \
            "- Sync upstream release \`${TAG}\` from \`${UPSTREAM_REPO}\` into \`${BASE}\`." \
            "- Rolling branch \`${SYNC_BRANCH}\` points to sync commit \`${SYNC_HEAD}\` (mode: \`${SYNC_MODE}\`)." \
            '- This PR is generated by `.github/workflows/fork-sync-upstream-release.yml`.' \
            '' \
            '## Behavior' \
            '- Auto-merge is enabled when branch protection checks pass.' \
            '- If merge conflicts or required checks fail, watchdog workflow requests manual review.' \
            '- Older `upstream-sync` PRs from tag-specific branches are closed as superseded.' \
            '- `mode: merge` means the branch starts from your base branch and merges the upstream tag; `mode: tag` means fallback to raw upstream tag commit.')"

          if [ -z "${PR}" ]; then
            gh pr create \
              -R "${REPO}" \
              --base "${BASE}" \
              --head "${SYNC_BRANCH}" \
              --title "chore(sync): merge upstream ${TAG} into ${BASE}" \
              --body "${BODY}"
            PR="$(gh pr list -R "${REPO}" --state open --base "${BASE}" --head "${SYNC_BRANCH}" --json number --jq '.[0].number // empty')"
          else
            gh pr edit -R "${REPO}" "${PR}" \
              --title "chore(sync): merge upstream ${TAG} into ${BASE}" \
              --body "${BODY}"
          fi

          if [ -z "${PR}" ]; then
            echo "::error::Failed to resolve sync PR number"
            exit 1
          fi

          gh pr edit -R "${REPO}" "${PR}" --add-label "upstream-sync"

          mapfile -t STALE_PRS < <(gh pr list -R "${REPO}" --state open --base "${BASE}" --label upstream-sync --json number,headRefName --jq ".[] | select(.headRefName != \"${SYNC_BRANCH}\") | .number")

          for OLD_PR in "${STALE_PRS[@]}"; do
            gh pr close -R "${REPO}" "${OLD_PR}" --comment "Superseded by #${PR} on \`${SYNC_BRANCH}\` (latest tag: \`${TAG}\`)." || true
          done

          if gh pr merge -R "${REPO}" "${PR}" --auto --merge; then
            echo "Enabled auto-merge for PR #${PR}."
            exit 0
          fi

          MERGEABLE="$(gh pr view -R "${REPO}" "${PR}" --json mergeable --jq '.mergeable')"
          FLAGGED="$(gh api "repos/${REPO}/issues/${PR}/comments" --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("[sync-watchdog]")))] | length')"

          if [ "${FLAGGED}" -eq 0 ]; then
            MENTION=""
            if [ -n "${REVIEWER}" ]; then
              gh pr edit -R "${REPO}" "${PR}" --add-reviewer "${REVIEWER}" || true
              MENTION="@${REVIEWER} "
            fi

            gh pr comment -R "${REPO}" "${PR}" --body "[sync-watchdog] ${MENTION}Auto-merge could not be enabled (mergeable=${MERGEABLE}). Please review this sync PR."
          fi
