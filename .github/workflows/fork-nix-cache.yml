name: fork-nix-cache

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == vars.FORK_SYNC_BASE_BRANCH || (vars.FORK_SYNC_BASE_BRANCH == '' && github.ref_name == github.event.repository.default_branch) || startsWith(github.ref_name, 'sync/upstream-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Detect Cachix settings
        id: cachix
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "$CACHIX_CACHE" ] && [ -n "$CACHIX_AUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Login to Cachix
        if: ${{ steps.cachix.outputs.enabled == 'true' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build opencode package
        run: nix build .#opencode --accept-flake-config --print-build-logs

      - name: Push build output to Cachix
        if: ${{ steps.cachix.outputs.enabled == 'true' }}
        run: cachix push "${{ vars.CACHIX_CACHE }}" "$(nix path-info .#opencode)"
