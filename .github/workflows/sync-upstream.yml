name: Sync Upstream Releases

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip push and PR operations.
        type: boolean
        required: false
        default: true
      release_selector:
        description: Release selector to test.
        type: string
        required: false
        default: latest

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/sync-upstream-release.yml
    with:
      upstream_owner: anomalyco
      upstream_repo: opencode
      base_branch: dev
      release_selector: ${{ github.event_name == 'workflow_dispatch' && inputs.release_selector || 'latest' }}
      sync_branch_prefix: sync/upstream-release
      sync_branch: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_selector || 'latest') == 'latest' && 'sync/upstream-release' || '' }}
      pr_labels: upstream-sync
      pr_title: Sync upstream release {tag}
      policy_script: ci/fork-policy.sh
      merge_method: merge
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets:
      token: ${{ secrets.FORK_SYNC_TOKEN }}
