name: fork-sync-kit test

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip push and PR operations.
        type: boolean
        required: false
        default: true
      release_selector:
        description: Release selector to test.
        type: string
        required: false
        default: latest

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/sync-upstream-release.yml
    with:
      upstream_owner: anomalyco
      upstream_repo: opencode
      base_branch: dev
      release_selector: ${{ inputs.release_selector }}
      sync_branch_prefix: sync/upstream-release
      pr_labels: upstream-sync
      pr_title: Sync upstream release {tag}
      policy_script: ""
      merge_method: merge
      dry_run: ${{ inputs.dry_run }}
